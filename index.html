
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>BSI Owls Shotclock</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon"
        sizes="512x512"
        href="./icon-512.png?v=5">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BSI Owls">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* FULLSKJERM-IKON */

    #fullscreen {
      position: absolute;
      top: calc(15px + env(safe-area-inset-top));
      right: calc(15px + env(safe-area-inset-right));

      width: 44px;
      height: 44px;
      padding: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      color: white;
      border: none;
      cursor: pointer;
      opacity: 0.7;
    }

    #fullscreen svg {
      width: 25px;
      height: 25px;
    }

    #fullscreen:hover {
      opacity: 1;
    }

    /* OVERSKRIFT */

    h1 {
      font-size: clamp(24px, 5vw, 48px);
      letter-spacing: 3px;
      margin: 0 0 20px;
      font-weight: 800;
    }

    /* NEDTELLING */

    #clock {
      font-size: clamp(170px, 48vw, 520px);
      font-weight: 900;
      color: #fa74b5;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 35px;
    }

    /* KNAPPER */

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .controls button {
      padding: 18px 28px;
      font-size: 20px;
      font-weight: bold;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      background: #343840;
    }

    .controls button:hover {
      filter: brightness(1.15);
    }

    .controls .start {
      background: #208454;
    }

    .controls .reset {
      background: #fa74b5;
    }

    /* MOBIL */

    @media (max-width: 600px) {
      main {
        padding: 12px;
      }

      h1 {
        font-size: clamp(22px, 6vw, 32px);
        letter-spacing: 2px;
        margin-bottom: 25px;
      }

      #clock {
        font-size: min(65vw, 38dvh);
        margin-bottom: 35px;
      }

      .controls button {
        font-size: 18px;
        padding: 16px 20px;
      }
    }

    
    /* PLUSS OG MINUS */
    
    .adjust-controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 18px;
    }
    
    .adjust-controls button {
      width: 75px;
      height: 60px;
      border: none;
      border-radius: 12px;
      background: #343840;
      color: white;
      font-size: 34px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .adjust-controls button:hover {
      filter: brightness(1.15);
    }
    
    .adjust-controls button:active {
      background: #fa74b5;
    }
  </style>
</head>

<body>

<main>

  <!-- FULLSKJERM-SYMBOL -->
  <button id="fullscreen"
          aria-label="Fullskjerm"
          title="Fullskjerm">

    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
      <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
      <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>

    </svg>
  </button>

  <h1>BSI OWLS - SHOTCLOCK</h1>

  <div id="clock">30</div>

  <div class="controls">
    <button class="start" id="start">Start</button>
    <button id="pause">Pause</button>
    <button class="reset" id="reset">Reset 30</button>
    <button id="minus" aria-label="Trekk fra 1 sekund">−</button>
    <button id="plus" aria-label="Legg til 1 sekund">+</button>
  </div>

</main>

<script>
  // ==========================================
  // INNSTILLINGER
  // ==========================================

  const DURATION = 30000;
  const BEEP_START = 10;
  const BEEP_FREQUENCY = 880;
  const FINAL_FREQUENCY = 650;

  // ==========================================
  // VARIABLER
  // ==========================================

  const clock = document.getElementById("clock");

  let remaining = DURATION;
  let deadline = 0;
  let running = false;
  let frame = null;
  let audioContext = null;
  let lastBeepSecond = null;
  let finalBeepPlayed = false;

  // ==========================================
  // LYD - FUNGERER PÅ IPHONE
  // ==========================================

  function getAudio() {
    const AudioCtx =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioCtx) return null;

    if (!audioContext) {
      audioContext = new AudioCtx();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume().catch(console.error);
    }

    return audioContext;
  }

  function unlockAudio() {
    const ctx = getAudio();
    if (!ctx) return;

    const buffer = ctx.createBuffer(1, 1, 22050);
    const source = ctx.createBufferSource();

    source.buffer = buffer;
    source.connect(ctx.destination);
    source.start(0);
  }

  document.addEventListener("touchstart", unlockAudio, {
    once: true
  });

  document.addEventListener("click", unlockAudio, {
    once: true
  });

  function beep(duration = 0.12, frequency = 880) {
    const ctx = getAudio();

    if (!ctx) return;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = frequency;

    gain.gain.setValueAtTime(0.8, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  // ==========================================
  // VIS KLOKKEN
  // ==========================================

  function render() {
    clock.textContent = Math.ceil(remaining / 1000);
  }

  // ==========================================
  // NEDTELLING
  // ==========================================

  function tick() {
    if (!running) return;

    remaining = Math.max(
      0,
      deadline - performance.now()
    );

    const seconds = Math.ceil(remaining / 1000);

    render();

    // Korte pip fra 10 til 2
    if (
      seconds <= BEEP_START &&
      seconds >= 2 &&
      seconds !== lastBeepSecond
    ) {
      beep(0.12, BEEP_FREQUENCY);
      lastBeepSecond = seconds;
    }

    // Langt pip når klokken viser 1
    if (seconds === 1 && !finalBeepPlayed) {
      beep(1.2, FINAL_FREQUENCY);
      finalBeepPlayed = true;
      lastBeepSecond = 1;
    }

    // Stopp ved 0 - ingen ekstra lyd
    if (remaining === 0) {
      running = false;
      frame = null;
      return;
    }

    frame = requestAnimationFrame(tick);
  }

  // ==========================================
  // START
  // ==========================================

  function start() {
    if (running || remaining === 0) return;

    getAudio();

    running = true;
    deadline = performance.now() + remaining;

    tick();
  }

  // ==========================================
  // PAUSE
  // ==========================================

  function pause() {
    if (!running) return;

    remaining = Math.max(
      0,
      deadline - performance.now()
    );

    running = false;
    cancelAnimationFrame(frame);
    frame = null;

    render();
  }

  // ==========================================
  // RESET
  // ==========================================

  function reset() {
    running = false;
    cancelAnimationFrame(frame);
    frame = null;

    remaining = DURATION;
    lastBeepSecond = null;
    finalBeepPlayed = false;

    render();
    start();
  }

  
  // ==========================================
  // JUSTER TID MED + OG -
  // ==========================================

  function adjustTime(seconds) {
    // Finn gjeldende tid
    if (running) {
      remaining = Math.max(
        0,
        deadline - performance.now()
      );
    }

    // Legg til eller trekk fra sekunder
    remaining = Math.max(
      0,
      remaining + seconds * 1000
    );

    // Oppdater slutttiden hvis klokken går
    if (running) {
      deadline = performance.now() + remaining;
    }

    // Tillat nye pip når tiden justeres
    lastBeepSecond = Math.ceil(remaining / 1000);
    finalBeepPlayed = remaining <= 1000;

    // Vis ny tid
    render();

    // Stopp hvis tiden er 0
    if (remaining === 0) {
      running = false;
      cancelAnimationFrame(frame);
      frame = null;
    }
  }

  document.getElementById("plus").onclick = () => {
    adjustTime(1);
  };

  document.getElementById("minus").onclick = () => {
    adjustTime(-1);
  };

  // ==========================================
  // KNAPPER
  // ==========================================

  document.getElementById("start").onclick = start;
  document.getElementById("pause").onclick = pause;
  document.getElementById("reset").onclick = reset;

  // ==========================================
  // FULLSKJERM
  // ==========================================

  document.getElementById("fullscreen").onclick = async () => {
    try {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      console.log("Fullskjerm støttes ikke her:", error);
    }
  };

  // ==========================================
  // TASTATURSNARVEIER
  // ==========================================

  document.addEventListener("keydown", e => {

    if (e.code === "Space") {
      e.preventDefault();

      if (running) {
        pause();
      } else {
        start();
      }
    }

    if (e.key.toLowerCase() === "r") {
      reset();
    }

  });

  // Vis 30 ved oppstart
  render();

</script>

</body>
</html>
